name: Release

# Runs when a version tag is pushed: git tag -a v0.2.0 -m "..." && git push origin v0.2.0
on:
    push:
        tags: ["v*"]

permissions:
    contents: write # create the GitHub Release
    packages: write # push the image to ghcr.io

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - run: make test

    release:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            # ghcr.io needs a lowercase name: ghcr.io/mateusdsouza/k8s-pipeline-controller:v0.2.0
            - name: Image name
              run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push (amd64 + arm64)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ env.IMG }}
                  labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

            # One file with the CRDs, RBAC and the Deployment pointing at the image just pushed
            - name: Build install.yaml
              run: make build-installer IMG="$IMG"

            - name: GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" dist/install.yaml --generate-notes --verify-tag
