name: Vulncheck

# Known vulnerabilities in the Go code and its dependencies that the code actually calls.
on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    govulncheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
