---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pipelines.ci.example.com
spec:
  group: ci.example.com
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    shortNames:
    - pl
    singular: pipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startTime
      name: Started
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Pipeline runs a sequence of jobs, each built from a PipelineJobTemplate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the jobs to run. Immutable after creation.
            properties:
              jobs:
                description: |-
                  jobs run sequentially in the order listed.
                  MaxItems keeps the index at 2 digits; the Job name length rule on Pipeline depends on it -> check internal/controller/job_builder_test.go
                items:
                  description: 'PipelineJob is one entry of the pipeline: a named
                    reference to a template.'
                  properties:
                    name:
                      description: |-
                        name identifies the job within the pipeline and is used to name
                        the Kubernetes Job. Must be a DNS-1123 label, unique in the pipeline.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    templateRef:
                      description: templateRef is the name of a PipelineJobTemplate
                        in the same namespace.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  - templateRef
                  type: object
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - jobs
            type: object
            x-kubernetes-validations:
            - message: pipeline spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of Pipeline
            properties:
              completionTime:
                description: completionTime is when the pipeline reached Succeeded
                  or Failed.
                format: date-time
                type: string
              conditions:
                description: conditions give details on the pipeline state, e.g. why
                  it failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobs:
                description: jobs reports the state of each job, in spec order.
                items:
                  description: JobStatus reports the state of one pipeline job.
                  properties:
                    completionTime:
                      description: completionTime is when the job succeeded or failed.
                      format: date-time
                      type: string
                    jobName:
                      description: jobName is the name of the Kubernetes Job created
                        for this job.
                      type: string
                    name:
                      description: name matches the job name in spec.jobs.
                      type: string
                    phase:
                      description: phase is the current state of this job.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      type: string
                    startTime:
                      description: startTime is when the Kubernetes Job was created.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              phase:
                description: 'phase summarizes the pipeline: Pending, Running, Succeeded
                  or Failed.'
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startTime:
                description: startTime is when the first job was created.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: pipeline name + job name must be at most 59 characters
          rule: self.spec.jobs.all(j, self.metadata.name.size() + j.name.size() +
            4 <= 63)
    served: true
    storage: true
    subresources:
      status: {}
