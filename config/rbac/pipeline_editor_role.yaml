# This rule is not used by the project k8s-pipeline-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ci.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-pipeline-controller
    app.kubernetes.io/managed-by: kustomize
  name: pipeline-editor-role
rules:
- apiGroups:
  - ci.example.com
  resources:
  - pipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ci.example.com
  resources:
  - pipelines/status
  verbs:
  - get
