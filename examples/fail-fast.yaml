apiVersion: ci.example.com/v1alpha1
kind: PipelineJobTemplate
metadata:
  name: broken
spec:
  steps:
    - name: fail
      image: busybox
      command: ["sh", "-c", "echo breaking && exit 1"]
---
apiVersion: ci.example.com/v1alpha1
kind: Pipeline
metadata:
  name: fail-fast
spec:
  jobs:
    - name: build
      templateRef: broken
    - name: deploy          # must never start
      templateRef: deploy