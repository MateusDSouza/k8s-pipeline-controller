# Reusable job templates shared by every scenario.
# build, test and deploy succeed; broken fails on purpose (exit 1).
apiVersion: ci.example.com/v1alpha1
kind: PipelineJobTemplate
metadata:
  name: build
spec:
  steps:
    - name: checkout
      image: busybox:1.37
      command: ["sh", "-c", "echo cloning the repository && sleep 2"]
    - name: compile
      image: busybox:1.37
      command: ["sh", "-c", "echo compiling && sleep 2"]
---
apiVersion: ci.example.com/v1alpha1
kind: PipelineJobTemplate
metadata:
  name: test
spec:
  steps:
    - name: unit-tests
      image: busybox:1.37
      command: ["sh", "-c", "echo running unit tests && sleep 2"]
---
apiVersion: ci.example.com/v1alpha1
kind: PipelineJobTemplate
metadata:
  name: deploy
spec:
  steps:
    - name: deploy
      image: busybox:1.37
      command: ["sh", "-c", "echo deploying && sleep 2"]
---
apiVersion: ci.example.com/v1alpha1
kind: PipelineJobTemplate
metadata:
  name: broken
spec:
  steps:
    - name: fail
      image: busybox:1.37
      command: ["sh", "-c", "echo something went wrong && exit 1"]
